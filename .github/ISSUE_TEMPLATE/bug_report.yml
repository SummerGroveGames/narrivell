name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Please don't attach your real manuscript** – this repo is public. If a file is needed, make a small made-up example.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: dropdown
    id: text-lost
    attributes:
      label: Was any writing lost or overwritten?
      options:
        - "No"
        - "Yes"
        - "Not sure"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. See …
  - type: dropdown
    id: platform
    attributes:
      label: Device
      options:
        - Windows – Chrome
        - Windows – Edge
        - Android – Chrome
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in Settings › About
