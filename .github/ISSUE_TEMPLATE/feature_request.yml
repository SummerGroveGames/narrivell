name: Feature request
description: Suggest an idea for Narrivell
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the writing or revision task, and what makes it hard today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: Your idea for how Narrivell could handle it.
  - type: textarea
    id: alternatives
    attributes:
      label: How do you handle it now?
      description: Other apps, workarounds, paper notes…
