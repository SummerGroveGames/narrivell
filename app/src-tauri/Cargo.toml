[package]
name = "narrivell"
version = "0.0.1"
description = "Narrivell – a writing app that never loses a word"
authors = ["Summer Grove Software"]
license-file = "../../LICENSE"
publish = false
repository = "https://github.com/SummerGroveGames/narrivell"
edition = "2021"

[lib]
# The _lib suffix avoids a name clash with the app binary on Windows.
name = "narrivell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
