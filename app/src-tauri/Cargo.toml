[package]
name = "narrivell"
version = "0.0.1"
description = "Narrivell – a writing app that never loses a word"
authors = ["Summer Grove Software"]
license-file = "../../LICENSE"
publish = false
repository = "https://github.com/SummerGroveGames/narrivell"
edition = "2021"

[lib]
# The _lib suffix avoids a name clash with the app binary on Windows.
name = "narrivell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
# Official Tauri plugins only. Each one is limited by capabilities/default.json.
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-persisted-scope = "2"
# Needed by tauri::generate_context!() once tauri.conf.json has a "plugins" section.
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# AI connections (src/ai.rs): HTTPS with rustls, keys in the OS credential store.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "3", features = ["windows-native", "sync-secret-service", "crypto-rust"] }
# Cloud sign-in (src/cloud.rs): PKCE and the one-time loopback address.
base64 = "0.23"
sha2 = "0.10"
getrandom = "0.2"
tokio = { version = "1", features = ["net", "io-util", "time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
